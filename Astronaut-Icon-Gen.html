
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Contrast Astronaut Helmet Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f7;
            display: flex;
            height: 100vh;
            overflow: hidden;

        }
        .sidebar {
            width: 340px;
            background-color: #121216;
            border-right: 1px solid #2d2d37;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-header {
            position: sticky;
            top: -20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: -20px -20px 0;
            padding: 20px;
            background: #121216;
            border-bottom: 1px solid #2d2d37;
        }
        .sidebar-actions {
            display: flex;
            gap: 8px;
        }
        .preview-status {
            font-size: 0.75rem;
            line-height: 1.35;
            color: #83d7a3;
        }
        .preview-status.is-stale {
            color: #ffd166;
        }
        .main-content {
            flex-grow: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;

        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }
        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8e8e93;
            margin-bottom: 10px;
            border-bottom: 1px solid #2d2d37;
            padding-bottom: 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;

            gap: 12px;
            background: #1a1a22;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d2d37;
        }
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nested-toggles {
            display: flex;

            flex-direction: column;
            gap: 8px;
            padding-left: 8px;
            border-left: 1px dashed #424252;
            margin-top: 4px;
        }
        label {
            font-size: 0.85rem;
            color: #e5e5ea;
        }
        .val-display {
            font-size: 0.85rem;
            color: #0a84ff;
            font-family: monospace;
        }
        input[type="number"] {
            width: 80px;
            background-color: #2d2d37;
            border: 1px solid #424252;

            color: #ffffff;
            padding: 6px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            outline: none;
            text-align: right;
        }
        input[type="number"]:focus {
            border-color: #0a84ff;
        }
        select {
            width: 150px;
            background-color: #2d2d37;
            border: 1px solid #424252;
            color: #ffffff;
            padding: 7px 9px;
            border-radius: 6px;
            font: inherit;
            font-size: 0.85rem;
        }
        select:focus-visible {
            outline: 2px solid #0a84ff;
            outline-offset: 2px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #0a84ff;
            background: #2d2d37;
            height: 6px;
            border-radius: 3px;
            appearance: none;
            outline: none;

        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }
        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #424252;
            border-radius: 6px;
        }
        .radio-group {
            display: flex;
            gap: 10px;
            background: #2d2d37;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #424252;
        }
        .radio-item {
            flex: 1;
            position: relative;
        }

        .radio-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .radio-item label {
            display: block;
            text-align: center;
            font-size: 0.75rem;
            padding: 6px 0;
            border-radius: 4px;
            cursor: pointer;
            color: #8e8e93;
            font-family: monospace;
            font-weight: 600;
        }
        .radio-item input[type="radio"]:checked + label {
            background-color: #0a84ff;

            color: #ffffff;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            user-select: none;
        }
        .grid-container-scroll {
            flex-grow: 1;
            background-color: #121216;
            border-radius: 12px;
            border: 1px solid #2d2d37;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;
            position: relative;
        }
        .canvas-zoom-wrapper {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            display: inline-block;
        }
        #display-canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: block;
        }
        .toast {
            position: absolute;
            bottom: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;

            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .btn {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: center;
            flex: 1;
            min-width: 0;
        }
        .btn-secondary {

            background-color: #2d2d37;
            border: 1px solid #424252;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div>
                <h1>Helmet Generator</h1>
                <p style="font-size:0.75rem; color:#8e8e93;">Production Export Hub</p>
            </div>
            <div class="sidebar-actions">
                <button class="btn" id="btn-generate">Generate</button>
                <button class="btn btn-secondary" id="btn-export">Export PNG</button>
            </div>
            <p class="preview-status" id="preview-status" role="status" aria-live="polite">View is current.</p>
        </div>

        <div class="control-group">
            <h2>Grid Arrangement</h2>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-cols">Columns (X)</label>

                    <input type="number" id="input-cols" min="1" max="50" value="5">
                </div>
            </div>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-rows">Rows (Y)</label>
                    <input type="number" id="input-rows" min="1" max="50" value="5">
                </div>
            </div>
        </div>

        <div class="control-group">
            <h2>Layout Geometry</h2>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-frame-size">Frame Size (px)</label>
                    <input type="number" id="input-frame-size" min="32" max="1000" value="100">
                </div>
            </div>

            <div class="control-item">
                <div class="control-row">
                    <label for="input-sticker-border">Sticker Border (px)</label>
                    <input type="number" id="input-sticker-border" min="0" max="100" value="35">
                </div>
            </div>
            <div class="control-item">
                <div class="control-row">
                    <label for="sticker-border-style">Border Color</label>
                    <select id="sticker-border-style">
                        <option value="white" selected>White</option>
                        <option value="foil">Foil gradient</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="control-row" id="custom-border-row" hidden>
                    <label for="sticker-border-color">Custom color</label>
                    <input type="color" id="sticker-border-color" value="#ffffff">
                </div>
            </div>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-spacing">Spacing Margin (px)</label>
                    <input type="number" id="input-spacing" min="0" max="200" value="28">
                </div>
            </div>
        </div>

        <div class="control-group">
            <h2>Environment Color</h2>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-bg-color">Canvas Background</label>

                    <input type="color" id="input-bg-color" value="#000000">
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" id="transparent-background">
                    <span>Transparent background</span>
                </label>
            </div>
        </div>

        <div class="control-group">
            <h2>Palette</h2>
            <div class="control-row">
                <label for="palette-select">Color scheme</label>
                <select id="palette-select">
                    <option value="main" selected>Main</option>
                    <option value="foil">Foil</option>
                    <option value="default">Default</option>
                </select>
            </div>
        </div>

        <div class="control-group">
            <h2>Color Adjustments</h2>
            <div class="control-item">
                <div class="control-row">

                    <label for="input-brightness">Brightness Shift</label>
                    <span id="brightness-val" class="val-display">0</span>
                </div>
                <input type="range" id="input-brightness" min="-100" max="100" value="0">
            </div>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-scale">Scale Multiplier (%)</label>
                    <input type="number" id="input-scale" min="1" max="500" value="100">
                </div>
            </div>
        </div>

        <div class="control-group">
            <h2>Workspace View</h2>
            <div class="control-item">
                <div class="control-row">
                    <label for="input-zoom">Interface Zoom Scale</label>
                    <span id="zoom-val" class="val-display">100%</span>

                </div>
                <input type="range" id="input-zoom" min="10" max="200" value="100" step="5">
            </div>
        </div>

        <div class="control-group">
            <h2>Variation</h2>
            <div class="control-row">
                <label class="checkbox-container">
                    <input type="checkbox" id="lock-colors">
                    <span>Lock Palette Across Grid</span>
                </label>
            </div>
            
            <div class="control-item" style="margin-top: 6px;">
                <label style="font-weight: 600; color: #8e8e93; font-size: 0.75rem;">SHELL SHAPES</label>
                <div class="nested-toggles">
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-round" checked> <span>Round</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-square" checked> <span>Soft-square</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-tapered" checked> <span>Tapered</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-faceted" checked> <span>Rounded five-facet</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-gear" checked> <span>Gear-facet</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-shell-squid" checked> <span>Squid</span></label>
                </div>
            </div>

            <div class="control-item" style="margin-top: 4px;">
                <label style="font-weight: 600; color: #8e8e93; font-size: 0.75rem;">VISOR SHARDS ALLOWED</label>
                <div class="nested-toggles">
                    <label class="checkbox-container"><input type="checkbox" id="allow-visor-bulb" checked> <span>Bulbous Bubble Glass</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-visor-hex" checked> <span>Angled Hex Glass</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-visor-slot" checked> <span>Narrow Slot Glass</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-visor-tactical" checked> <span>Matte Robot Dots Plate</span></label>
                </div>
            </div>

            <div class="control-item" style="margin-top: 4px;">
                <label style="font-weight: 600; color: #8e8e93; font-size: 0.75rem;">FOREHEAD DECALS ALLOWED</label>
                <div class="nested-toggles">
                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-none" checked> <span>Clean Head Shell (None)</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-triangle" checked> <span>Triangle Decals</span></label>

                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-mform" checked> <span>M-Form "Rabbit Ears"</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-ellipse" checked> <span>Centered Ellipses</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-square" checked> <span>Rect Badges (Stop Short)</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-decal-pinstripe" checked> <span>Pinstripes (Go Past Visor)</span></label>
                </div>
            </div>

            <div class="control-item" style="margin-top: 4px;">
                <label style="font-weight: 600; color: #8e8e93; font-size: 0.75rem;">ATTACHMENT INCLUSIONS</label>
                <div class="nested-toggles">
                    <label class="checkbox-container"><input type="checkbox" id="allow-att-scanner" checked> <span>Side Utility Scanners</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-att-antenna" checked> <span>Modular Spike Antennas</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-att-tubes" checked> <span>Corrugated Gas Tubes</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-att-breather" checked> <span>Breather module</span></label>
                    <label class="checkbox-container"><input type="checkbox" id="allow-att-mouth" checked> <span>Dark breather variant</span></label>
                </div>
            </div>
        </div>

        <div class="control-group">

            <h2>Export Target Density</h2>
            <div class="control-item">
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="dpi-72" name="dpi-select" value="1" checked>
                        <label for="dpi-72">72 DPI</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="dpi-150" name="dpi-select" value="2.083">
                        <label for="dpi-150">150 DPI</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="dpi-300" name="dpi-select" value="4.166" checked>
                        <label for="dpi-300">300 DPI</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="grid-container-scroll">
            <div class="canvas-zoom-wrapper" id="canvas-wrapper">
                <canvas id="display-canvas"></canvas>
            </div>
            <div class="toast" id="toast-msg">Generating High Density Export Stream...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('display-canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        // Tapered ear-disc tuning: centerX controls spacing; radius controls size.
        const taperedEarDiscCenterX = 30;
        const taperedEarDiscCenterY = -10;
        const taperedEarDiscRadius = 55;
        const taperedEarDiscStrokeWidth = 9;

        const inputCols = document.getElementById('input-cols');

        const inputRows = document.getElementById('input-rows');
        const inputFrameSize = document.getElementById('input-frame-size');
        const inputStickerBorder = document.getElementById('input-sticker-border');
        const stickerBorderStyle = document.getElementById('sticker-border-style');
        const stickerBorderColor = document.getElementById('sticker-border-color');
        const customBorderRow = document.getElementById('custom-border-row');
        const inputSpacing = document.getElementById('input-spacing');
        const inputScale = document.getElementById('input-scale');
        const inputBgColor = document.getElementById('input-bg-color');
        const transparentBackground = document.getElementById('transparent-background');
        const inputZoom = document.getElementById('input-zoom');
        const zoomVal = document.getElementById('zoom-val');
        const paletteSelect = document.getElementById('palette-select');
        const inputBrightness = document.getElementById('input-brightness');
        const brightnessVal = document.getElementById('brightness-val');
        
        const lockColors = document.getElementById('lock-colors');
        const btnGenerate = document.getElementById('btn-generate');
        const btnExport = document.getElementById('btn-export');
        const previewStatus = document.getElementById('preview-status');
        const toastMsg = document.getElementById('toast-msg');

        // Inclusion Toggle Checkbox References
        const allowShellRound = document.getElementById('allow-shell-round');

        const allowShellSquare = document.getElementById('allow-shell-square');
        const allowShellTapered = document.getElementById('allow-shell-tapered');
        const allowShellFaceted = document.getElementById('allow-shell-faceted');
        const allowShellGear = document.getElementById('allow-shell-gear');
        const allowShellSquid = document.getElementById('allow-shell-squid');
        
        const allowVisorBulb = document.getElementById('allow-visor-bulb');
        const allowVisorHex = document.getElementById('allow-visor-hex');
        const allowVisorSlot = document.getElementById('allow-visor-slot');
        const allowVisorTactical = document.getElementById('allow-visor-tactical');

        const allowDecalNone = document.getElementById('allow-decal-none');
        const allowDecalTriangle = document.getElementById('allow-decal-triangle');
        const allowDecalMform = document.getElementById('allow-decal-mform');
        const allowDecalEllipse = document.getElementById('allow-decal-ellipse');
        const allowDecalSquare = document.getElementById('allow-decal-square');
        const allowDecalPinstripe = document.getElementById('allow-decal-pinstripe');

        const allowAttScanner = document.getElementById('allow-att-scanner');
        const allowAttAntenna = document.getElementById('allow-att-antenna');
        const allowAttTubes = document.getElementById('allow-att-tubes');
        const allowAttBreather = document.getElementById('allow-att-breather');
        const allowAttMouth = document.getElementById('allow-att-mouth');


        // Master Base-Land Matrix Array
        const baseLandMatrix = [
            {base:[70,140,220], land:[90,200,150]},
            {base:[220,170,90], land:[200,120,70]},
            {base:[100,190,190], land:[155,175,90]},
            {base:[120,227,227], land:[145,255,80]},
            {base:[200,80,80], land:[255,130,40]},
            {base:[190,30,35], land:[190,125,100]},
            {base:[230,230,127], land:[255,200,60]},
            {base:[60,115,190], land:[205,220,60]},
            {base:[25,15,190], land:[70,140,65]},
            {base:[130,205,130], land:[130,135,95]},
            {base:[240,80,35], land:[175,125,55]},
            {base:[255,255,255], stroke:[200,200,160]},
            {base:[180,220,255], land:[255,255,255]},
            {base:[180,220,180], land:[255,245,165]},
            {base:[70,90,115], land:[126,145,90]},
            {base:[125,70,90], land:[175,70,100]},
            {base:[80,80,180], land:[190,220,145]},

            {base:[130,140,100], land:[150,100,60]},
            {base:[170,190,210], land:[100,150,172]},
            {base:[50,100,80], land:[200,230,100]},
            {base:[10,60,60], land:[90,205,120]},
            {base:[110,70,150], land:[240,160,220]},
            {base:[140,100,70], land:[210,200,180]},
            {base:[45,160,130], land:[165,135,190]},
            {base:[90,160,180], land:[190,130,80]},
            {base:[255,160,90], land:[255,215,75]}
        ];

        let gridSeeds = [];
        let hasPendingStructuralChanges = false;
        let livePreviewFrame = 0;

        btnGenerate.addEventListener('click', () => {
            generateGridSeeds();
            renderGrid();
            setPreviewCurrent();
        });

        stickerBorderStyle.addEventListener('change', () => {
            customBorderRow.hidden = stickerBorderStyle.value !== 'custom';
            renderLivePreview();
        });

        inputBrightness.addEventListener('input', () => {
            brightnessVal.textContent = inputBrightness.value;
            renderLivePreview();
        });

        const livePreviewControls = [
            inputCols,
            inputRows,
            inputFrameSize,
            inputStickerBorder,
            stickerBorderColor,
            inputSpacing,
            inputScale,
            inputBgColor,
            transparentBackground
        ];
        livePreviewControls.forEach(control => {
            control.addEventListener('input', renderLivePreview);
            control.addEventListener('change', renderLivePreview);
        });

        paletteSelect.addEventListener('change', () => {
            refreshGridPalettes();
            renderLivePreview();
        });

        lockColors.addEventListener('change', () => {
            refreshGridPalettes();
            renderLivePreview();
        });

        document.querySelectorAll(
            '#allow-shell-round, #allow-shell-square, #allow-shell-tapered, #allow-shell-faceted, #allow-shell-gear, #allow-shell-squid, ' +
            '#allow-visor-bulb, #allow-visor-hex, #allow-visor-slot, #allow-visor-tactical, ' +
            '#allow-decal-none, #allow-decal-triangle, #allow-decal-mform, #allow-decal-ellipse, #allow-decal-square, #allow-decal-pinstripe, ' +
            '#allow-att-scanner, #allow-att-antenna, #allow-att-tubes, #allow-att-breather, #allow-att-mouth'
        ).forEach(control => {
            control.addEventListener('change', setPreviewStale);
        });
        
        inputZoom.addEventListener('input', () => {
            const zoomValue = inputZoom.value;
            zoomVal.textContent = `${zoomValue}%`;
            canvasWrapper.style.transform = `scale(${zoomValue / 100})`;
        });

        btnExport.addEventListener('click', triggerDensityDownload);

        function setPreviewStale() {
            hasPendingStructuralChanges = true;
            previewStatus.textContent = 'Changes not shown. Select Generate to refresh the view.';
            previewStatus.classList.add('is-stale');
        }

        function setPreviewCurrent() {
            hasPendingStructuralChanges = false;
            previewStatus.textContent = 'View is current.';
            previewStatus.classList.remove('is-stale');
        }

        function renderLivePreview() {
            if (livePreviewFrame) cancelAnimationFrame(livePreviewFrame);
            livePreviewFrame = requestAnimationFrame(() => {
                livePreviewFrame = 0;
                ensureGridSeeds();
                renderGrid();
                if (!hasPendingStructuralChanges) setPreviewCurrent();
            });
        }

        function pickRandom(arr) {

            return arr[Math.floor(Math.random() * arr.length)];
        }

        function applyBrightness(rgb, offset) {
            return rgb.map(val => {
                if (offset < 0) {
                    return Math.round(val * (1 + offset / 100));
                } else {
                    return Math.round(val + (255 - val) * (offset / 100));
                }
            });
        }

        function rgbToHex(rgb) {
            return "#" + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
        }

        function generateRandomPalette() {
            const brights = ['#00ffff', '#ff00ff', '#ffff00'];

            if (paletteSelect.value === 'main') {
                const pair1 = pickRandom(baseLandMatrix);
                const pair2 = pickRandom(baseLandMatrix);
                const pair3 = pickRandom(baseLandMatrix);
                return {
                    isMatrix: true,
                    gradStartRGB: pair1.base,
                    gradEndRGB: pair1.land || pair1.stroke || pair1.base,
                    accent1RGB: pair2.base,
                    accent2RGB: pair2.land || pair2.stroke || pair2.base,
                    accent3RGB: pair3.base,
                    grayTone: '#8e8e93',
                    foilReverse: Math.random() < 0.25
                };
            }

            if (paletteSelect.value === 'foil') {
                return {
                    isMatrix: false,
                    isFoil: true,
                    gradStart: '#ffe21a',
                    gradMid: '#f20b83',
                    gradEnd: '#16b9ee',
                    accent1: '#16b9ee',
                    accent2: '#ec168a',
                    accent3: '#ffe21a',
                    grayTone: '#8e8e93',
                    hoseLeft: '#ec168a',
                    hoseRight: '#16a9e2',
                    chinAccent: '#a52ac5',
                    foilReverse: Math.random() < 0.25
                };
            }

            {
                return {
                    isMatrix: false,
                    gradStart: pickRandom(brights),
                    gradMid: pickRandom(brights),
                    gradEnd: pickRandom(brights),

                    accent1: pickRandom(brights),
                    accent2: pickRandom(brights),
                    accent3: pickRandom(brights),
                    grayTone: '#8e8e93',
                    hoseLeft: pickRandom(brights),
                    hoseRight: pickRandom(brights),
                    chinAccent: pickRandom(brights),
                    foilReverse: Math.random() < 0.25
                };
            }
        }

        function generateRandomStructure() {
            const eyeConfigs = [1, 2, 3, 4, 6, 8];
            
            let shellPool = [];
            if (allowShellRound.checked) shellPool.push(0);
            if (allowShellSquare.checked) shellPool.push(1);
            if (allowShellTapered.checked) shellPool.push(2);
            if (allowShellFaceted.checked) shellPool.push(3);
            if (allowShellGear.checked) shellPool.push(4);
            if (allowShellSquid.checked) shellPool.push(5);
            if (shellPool.length === 0) shellPool = [0];


            let visorPool = [];
            if (allowVisorBulb.checked) visorPool.push(0);
            if (allowVisorHex.checked) visorPool.push(1);
            if (allowVisorSlot.checked) visorPool.push(2);
            if (allowVisorTactical.checked) visorPool.push(3);
            if (visorPool.length === 0) visorPool = [0];

            let decalPool = [];
            if (allowDecalNone.checked) decalPool.push(0); 
            if (allowDecalTriangle.checked) decalPool.push(1); 
            if (allowDecalMform.checked) decalPool.push(2); 
            if (allowDecalEllipse.checked) decalPool.push(3); 
            if (allowDecalSquare.checked) decalPool.push(4); 
            if (allowDecalPinstripe.checked) decalPool.push(5); 
            if (decalPool.length === 0) decalPool = [0];

            const hoseRibsCount = Math.floor(Math.random() * 3) + 5;

            return {
                baseShellArchetype: pickRandom(shellPool),
                visorArchetype: pickRandom(visorPool),

                chinArchetype: Math.floor(Math.random() * 3),      
                hasScanner: allowAttScanner.checked && (Math.random() > 0.4),
                hasAntennaLeft: allowAttAntenna.checked && (Math.random() > 0.5),
                hasAntennaRight: allowAttAntenna.checked && (Math.random() > 0.5),
                hasLowerTubes: allowAttTubes.checked && (Math.random() > 0.3),
                hasBreather: allowAttBreather.checked,
                crestDetailType: pickRandom(decalPool),    
                squareDecalSplitMode: Math.floor(Math.random() * 3), 
                hoseRibsCount,
                foilDecalReverse: Math.random() < 0.5,
                foilAccentReverse: Math.random() < 0.5,
                foilTubeReversals: Array.from({ length: hoseRibsCount }, () => Math.random() < 0.5),
                invertMouthpieceColor: allowAttMouth.checked && (Math.random() > 0.5),         
                eyeSensorCount: pickRandom(eyeConfigs)             
            };
        }

        function generateGridSeeds() {
            const cols = Math.max(1, parseInt(inputCols.value) || 1);
            const rows = Math.max(1, parseInt(inputRows.value) || 1);
            const totalItems = cols * rows;

            gridSeeds = [];

            const basePalette = generateRandomPalette();

            for (let i = 0; i < totalItems; i++) {
                gridSeeds.push({
                    palette: lockColors.checked ? basePalette : generateRandomPalette(),
                    structure: generateRandomStructure()
                });
            }
        }

        function ensureGridSeeds() {
            const cols = Math.max(1, parseInt(inputCols.value) || 1);
            const rows = Math.max(1, parseInt(inputRows.value) || 1);
            const totalItems = cols * rows;
            const basePalette = lockColors.checked ? generateRandomPalette() : null;

            while (gridSeeds.length < totalItems) {
                gridSeeds.push({
                    palette: basePalette || generateRandomPalette(),
                    structure: generateRandomStructure()
                });
            }
        }

        function refreshGridPalettes() {
            if (gridSeeds.length === 0) return;

            const sharedPalette = lockColors.checked ? generateRandomPalette() : null;
            gridSeeds.forEach(seed => {
                seed.palette = sharedPalette || generateRandomPalette();
            });
        }

        function renderGrid(targetCtx = ctx, targetCanvas = canvas, multiplier = 1) {
            const cols = Math.max(1, parseInt(inputCols.value) || 1);
            const rows = Math.max(1, parseInt(inputRows.value) || 1);
            const size = Math.max(32, parseInt(inputFrameSize.value) || 100);
            const margin = Math.max(0, parseInt(inputSpacing.value) || 0);
            const stickerBorder = Math.max(0, parseInt(inputStickerBorder.value) || 0);
            const scalePercentage = Math.max(1, Math.min(500, parseInt(inputScale.value) || 100));
            const globalScale = scalePercentage / 100;


            const totalWidth = ((size * cols) + (margin * (cols + 1))) * multiplier;
            const totalHeight = ((size * rows) + (margin * (rows + 1))) * multiplier;
            
            targetCanvas.width = totalWidth;
            targetCanvas.height = totalHeight;

            targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
            if (!transparentBackground.checked) {
                targetCtx.fillStyle = inputBgColor.value;
                targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);
            }

            ensureGridSeeds();

            const brightnessOffset = parseInt(inputBrightness.value) || 0;

            let index = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const posX = (margin + c * (size + margin)) * multiplier;

                    const posY = (margin + r * (size + margin)) * multiplier;

                    const seed = gridSeeds[index++];
                    if (!seed) continue;

                    targetCtx.save();
                    targetCtx.translate(posX + (size * multiplier) / 2, posY + (size * multiplier) / 2);
                    
                    const nativeScale = (size / 220) * globalScale * multiplier;
                    targetCtx.scale(nativeScale, nativeScale);

                    drawModularStickerHelmet(targetCtx, seed.palette, seed.structure, stickerBorder, brightnessOffset, stickerBorderStyle.value, stickerBorderColor.value);

                    targetCtx.restore();
                }
            }
        }

        function drawModularStickerHelmet(c, p, s, borderWeight, bOffset, borderStyle, customBorderColor) {

            c.lineCap = 'round';
            c.lineJoin = 'round';

            let cGradStart, cGradMid, cGradEnd, cAccent1, cAccent2, cAccent3, cHoseLeft, cHoseRight, cChinAccent;

            if (p.isMatrix) {
                const rgbStart = applyBrightness(p.gradStartRGB, bOffset);
                const rgbEnd = applyBrightness(p.gradEndRGB, bOffset);
                const rgbAcc1Start = applyBrightness(p.accent1RGB, bOffset);
                const rgbAcc1End = applyBrightness(p.accent2RGB, bOffset);
                const rgbAcc2Start = applyBrightness(p.accent3RGB, bOffset);

                cGradStart = rgbToHex(rgbStart);
                cGradEnd = rgbToHex(rgbEnd);
                cGradMid = rgbToHex([
                    Math.round((rgbStart[0] + rgbEnd[0]) / 2),
                    Math.round((rgbStart[1] + rgbEnd[1]) / 2),
                    Math.round((rgbStart[2] + rgbEnd[2]) / 2)
                ]);


                cAccent1 = rgbToHex(rgbAcc1Start);
                cAccent2 = rgbToHex(rgbAcc1End);
                cAccent3 = rgbToHex(rgbAcc2Start);
                cHoseLeft = rgbToHex(rgbEnd);
                cHoseRight = rgbToHex(rgbStart);
                cChinAccent = rgbToHex(rgbAcc1End);
            } else {
                const parseHex = (hex) => [
                    parseInt(hex.slice(1, 3), 16),
                    parseInt(hex.slice(3, 5), 16),
                    parseInt(hex.slice(5, 7), 16)
                ];

                cGradStart = rgbToHex(applyBrightness(parseHex(p.gradStart), bOffset));
                cGradMid = rgbToHex(applyBrightness(parseHex(p.gradMid), bOffset));
                cGradEnd = rgbToHex(applyBrightness(parseHex(p.gradEnd), bOffset));
                cAccent1 = rgbToHex(applyBrightness(parseHex(p.accent1), bOffset));
                cAccent2 = rgbToHex(applyBrightness(parseHex(p.accent2), bOffset));
                cAccent3 = rgbToHex(applyBrightness(parseHex(p.accent3), bOffset));

                cHoseLeft = rgbToHex(applyBrightness(parseHex(p.hoseLeft), bOffset));
                cHoseRight = rgbToHex(applyBrightness(parseHex(p.hoseRight), bOffset));
                cChinAccent = rgbToHex(applyBrightness(parseHex(p.chinAccent), bOffset));

            const activeGray = rgbToHex(applyBrightness([142, 142, 147], bOffset));
            const isFoil = p.isFoil === true;

                c.strokeStyle = '#000000';
                c.fillStyle = primaryGrad;
                c.beginPath(); c.arc(-taperedEarDiscCenterX, taperedEarDiscCenterY, taperedEarDiscRadius, 0, Math.PI * 2); c.fill(); c.stroke();
                c.beginPath(); c.arc(taperedEarDiscCenterX, taperedEarDiscCenterY, taperedEarDiscRadius, 0, Math.PI * 2); c.fill(); c.stroke();

            c.fill();
            c.strokeStyle = '#000000';
            c.lineWidth = 10;
            c.stroke();

            // ----------------------------------------------------
            // FOREHEAD DECALS: Clean solid-black object splits
            // ----------------------------------------------------
            c.save();
            c.strokeStyle = '#000000';
            c.lineWidth = 8;
            const foilDecalFill = isFoil
                ? createFoilIconGradient(c, s.foilDecalReverse, -24, -78, 24, -42)
                : '#000000';
            

            if (s.crestDetailType === 1) {
                // Triangle Decal
                c.fillStyle = foilDecalFill;
                c.beginPath();
                c.moveTo(-20, -74); c.lineTo(20, -74); c.lineTo(0, -48);
                c.closePath();
                c.fill(); c.stroke();
            } else if (s.crestDetailType === 2) {
                // M-Form "Rabbit Ears" Decal
                c.fillStyle = 'transparent';
                c.beginPath();
                c.moveTo(-22, -44); c.lineTo(-11, -58); c.lineTo(0, -44);
                c.moveTo(0, -44); c.lineTo(11, -58); c.lineTo(22, -44);
                c.stroke();
                
                c.fillStyle = isFoil ? foilDecalFill : cGradMid; 
                c.beginPath(); c.arc(-11, -48, 3.5, 0, Math.PI * 2); c.fill();
                c.beginPath(); c.arc(11, -48, 3.5, 0, Math.PI * 2); c.fill();
            } else if (s.crestDetailType === 3) {

                // Vertical Ellipse Decal
                c.fillStyle = foilDecalFill;
                c.beginPath();
                c.ellipse(0, -52, 22, 14, Math.PI / 2, 0, Math.PI * 2);
                c.fill(); c.stroke();
                
                c.fillStyle = isFoil ? foilDecalFill : cGradStart; 
                c.beginPath();
                c.ellipse(0, -52, 15, 9, Math.PI / 2, 0, Math.PI * 2);
                c.fill();
            } else if (s.crestDetailType === 4 || s.crestDetailType === 5) {
                c.fillStyle = isFoil ? '#000000' : foilDecalFill;
                const rectY = -78;
                let rectH = 22;

                if (s.crestDetailType === 5) {
                    // PINSTRIPE VARIANT: Cuts all the way down past the visor layout boundaries
                    rectH = 110;
                } else {

                    // UPDATED RECT BADGES VARIANT: Shrank length thresholds to stop a tad shorter above visor frames
                    if (s.visorArchetype === 0) {
                        rectH = 25; // Adjusted down from 34 to guarantee separation gap on bulb shapes
                    } else if (s.visorArchetype === 1) {
                        rectH = 36; // Adjusted down from 46 to cleanly float above hex drop lines
                    } else {
                        rectH = 44; // Adjusted down from 56 to float safely clear of straight slot panels
                    }
                }
                
                if (s.squareDecalSplitMode === 0) {
                    c.fillRect(-22, rectY, 44, rectH);
                } else if (s.squareDecalSplitMode === 1) {
                    c.fillRect(-24, rectY, 18, rectH);
                    c.fillRect(6, rectY, 18, rectH);
                } else {

            // ----------------------------------------------------

            // ----------------------------------------------------
            if (s.hasLowerTubes) {

                drawModularHoseLoop(c, 38, 40, 1, s.hoseRibsCount, cHoseRight, isFoil, s.foilTubeReversals);
            } else {
                c.fillStyle = isFoil ? createFoilIconGradient(c, s.foilAccentReverse, -62, 28, -44, 48) : activeGray;
                c.beginPath(); c.roundRect(-62, 28, 18, 20, 4); c.fill(); c.stroke();
                c.fillStyle = isFoil ? createFoilIconGradient(c, !s.foilAccentReverse, 44, 28, 62, 48) : activeGray;

            // ----------------------------------------------------
            c.fillStyle = isFoil ? createFoilIconGradient(c) : '#000000';
            c.strokeStyle = '#000000';

            c.lineWidth = 12;

            c.beginPath();
            if (s.visorArchetype === 0) {
                c.moveTo(-54, -10);
                c.bezierCurveTo(-54, -46, 54, -46, 54, -10);
                c.bezierCurveTo(54, 22, 36, 36, 0, 36);

                c.lineTo(-58, 4);
            } else {

            } else if (s.visorArchetype === 1) {

            if (isTacticalPlate) {

                c.ellipse(-22, -10, isFoil ? 6 : 8, isFoil ? 10 : 12, -0.2, 0, Math.PI * 2);

            c.strokeStyle = isFoil ? cAccent2 : '#ffffff';
            c.lineWidth = isFoil ? 7 : 6;
            c.beginPath();
            if (s.visorArchetype === 0) {

            c.beginPath();

            c.quadraticCurveTo(53, 23, 46, 29);
            c.stroke();

                c.fillStyle = isFoil ? createFoilIconGradient(c, s.foilAccentReverse, -20, -10, 20, 18)

                c.beginPath();
                if (s.chinArchetype === 0) {
                    buildHexValveGeom(c, 13);
                } else if (s.chinArchetype === 1) {
                    c.rect(-9, -5, 18, 18);
                } else {
                    c.moveTo(-15, -4); c.lineTo(15, -4); c.lineTo(8, 12); c.lineTo(-8, 12); c.closePath();
                }
                c.fill(); c.stroke();

                c.fillStyle = isFoil ? '#16b9ee' : isInverse ? cChinAccent : '#000000';
                c.fillRect(-2.5, -4, 5, 10);
                c.fillRect(-7.5, -2, 2.5, 6);
                c.fillRect(5, -2, 2.5, 6);
                c.restore();

                c.strokeStyle = '#000000';

                c.lineWidth = 8;
                c.beginPath();
                c.arc(0, 46, 32, Math.PI * 0.22, Math.PI * 0.78, false);
                c.stroke();
            }
        }

        function buildHelmetShellPath(c, s) {
            c.beginPath();
            if (s.baseShellArchetype === 0) {
                c.arc(0, -10, 68, Math.PI, 0, false);
            } else if (s.baseShellArchetype === 1) {
                c.moveTo(-68, 20);
                c.lineTo(-68, -48);
                c.quadraticCurveTo(-68, -76, -40, -76);
                c.lineTo(40, -76);
                c.quadraticCurveTo(68, -76, 68, -48);
                c.lineTo(68, 20);
            } else if (s.baseShellArchetype === 3 || s.baseShellArchetype === 4) {
                buildRoundedFacetTop(c, 20, s.baseShellArchetype === 4, 68);
            } else if (s.baseShellArchetype === 5) {
                buildTaperedCrownPath(c, 20, 68, -82);
            } else if (s.baseShellArchetype === 2) {
                buildTaperedHeadphonePath(c);
            } else {
                c.moveTo(-68, 20);
                c.lineTo(-40, -82);
                c.lineTo(40, -82);
                c.lineTo(68, 20);
            }
            c.bezierCurveTo(72, 32, 64, 66, 38, 74);
            c.bezierCurveTo(20, 80, -20, 80, -38, 74);
            c.bezierCurveTo(-64, 66, -72, 32, -68, 20);
            c.closePath();
        }

        function buildTaperedCrownPath(c, baseY, halfWidth, topY) {
            const sideStart = halfWidth * 0.78;
            const bumpOuter = halfWidth * 0.98;
            const topShoulder = halfWidth * 0.62;
            c.moveTo(-halfWidth, baseY);
            c.lineTo(-sideStart, -47);
            c.quadraticCurveTo(-halfWidth * 0.94, -49, -bumpOuter, -54);
            c.quadraticCurveTo(-halfWidth * 1.08, -62, -halfWidth * 0.94, -67);
            c.quadraticCurveTo(-halfWidth * 0.84, -72, -topShoulder, topY + 2);
            c.lineTo(topShoulder, topY + 2);
            c.quadraticCurveTo(halfWidth * 0.84, -72, halfWidth * 0.94, -67);
            c.quadraticCurveTo(halfWidth * 1.08, -62, bumpOuter, -54);
            c.quadraticCurveTo(halfWidth * 0.94, -49, sideStart, -47);
            c.lineTo(halfWidth, baseY);
        }

        function buildTaperedHeadphonePath(c) {
            c.moveTo(-68, 20);
            c.lineTo(-40, -82);
            c.lineTo(40, -82);
            c.lineTo(68, 20);
        }

        function buildRoundedFacetTop(c, baseY, withBumps, halfWidth) {
            const points = [
                [-halfWidth, baseY],
                [-halfWidth * 0.98, -32],
                [-halfWidth * 0.62, -67],
                [0, -80],
                [halfWidth * 0.62, -67],
                [halfWidth * 0.98, -32],
                [halfWidth, baseY]
            ];
            const radius = 5;
            const trimmed = points.map((point, index) => {
                const previous = points[(index - 1 + points.length) % points.length];
                const next = points[(index + 1) % points.length];
                const trimPoint = (other) => {
                    const dx = other[0] - point[0];
                    const dy = other[1] - point[1];
                    const distance = Math.hypot(dx, dy);
                    const trim = Math.min(radius, distance / 3);
                    return [point[0] + (dx / distance) * trim, point[1] + (dy / distance) * trim];
                };
                return { before: trimPoint(previous), after: trimPoint(next) };
            });

            c.moveTo(points[0][0], points[0][1]);
            for (let index = 1; index < points.length - 1; index++) {
                c.lineTo(trimmed[index].before[0], trimmed[index].before[1]);
                c.quadraticCurveTo(points[index][0], points[index][1], trimmed[index].after[0], trimmed[index].after[1]);

                const nextIndex = index + 1;
                const start = trimmed[index].after;
                const end = nextIndex === points.length - 1 ? points[nextIndex] : trimmed[nextIndex].before;
                if (withBumps && index < points.length - 2) {
                    const midpointX = (start[0] + end[0]) / 2;
                    const midpointY = (start[1] + end[1]) / 2;
                    const outwardX = midpointX;
                    const outwardY = midpointY + 24;
                    const length = Math.hypot(outwardX, outwardY) || 1;
                    c.quadraticCurveTo(
                        midpointX + (outwardX / length) * 14,
                        midpointY + (outwardY / length) * 14,
                        end[0],
                        end[1]
                    );
                } else {
                    c.lineTo(end[0], end[1]);
                }
            }
        }

        function createFoilGradient(c, reverse = false) {
            const gradient = c.createLinearGradient(-90, -70, 90, 70);
            gradient.addColorStop(0, reverse ? '#16b9ee' : '#ffe21a');
            gradient.addColorStop(0.35, reverse ? '#16b9ee' : '#ffe21a');
            gradient.addColorStop(0.62, '#f20b83');
            gradient.addColorStop(1, reverse ? '#ffe21a' : '#16b9ee');
            return gradient;
        }

        function createFoilIconGradient(c, reverse = false, x1 = -60, y1 = -60, x2 = 60, y2 = 60) {
            const gradient = c.createLinearGradient(x1, y1, x2, y2);
            gradient.addColorStop(0, reverse ? '#ffe21a' : '#16b9ee');
            gradient.addColorStop(0.35, reverse ? '#ffe21a' : '#16b9ee');
            gradient.addColorStop(0.62, '#f20b83');
            gradient.addColorStop(1, reverse ? '#16b9ee' : '#ffe21a');
            return gradient;
        }

        function drawOutlineAccessories(c, s, currentThickness, outlineColor) {
            c.lineWidth = currentThickness;
            c.strokeStyle = outlineColor;
            if (s.hasAntennaLeft) {
                c.beginPath(); c.moveTo(-68, -10); c.lineTo(-84, -44); c.lineTo(-78, -56); c.stroke();
            }
            if (s.hasAntennaRight) {
                c.beginPath(); c.moveTo(68, -10); c.lineTo(84, -44); c.stroke();
            }
            if (s.hasScanner) {
                c.beginPath(); c.rect(-82, -22, 12, 14); c.stroke();

            }
        }

        function buildHexValveGeom(c, r) {
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i + Math.PI / 6;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) c.moveTo(x, y);
                else c.lineTo(x, y);
            }
            c.closePath();
        }

        function drawModularHoseLoop(c, startX, startY, sideDir, segmentsCount, colorVal, isFoil, foilReversals) {
            c.save();
            c.lineWidth = 14;
            c.strokeStyle = '#ffffff';
            buildHosePath(c, startX, startY, sideDir, segmentsCount);

            c.stroke();

            c.lineWidth = 9;
            c.strokeStyle = '#000000';

            for (let i = 0; i < segmentsCount; i++) {
                const percent = i / (segmentsCount - 1);
                const angleOffset = percent * Math.PI * 0.65;
                const sweepAngle = (sideDir === -1) ? (Math.PI * 0.12 + angleOffset) : (Math.PI * 0.88 - angleOffset);
                
                const radiusX = 22;
                const radiusY = 28;
                const px = startX + Math.cos(sweepAngle) * radiusX;
                const py = startY + Math.sin(sweepAngle) * radiusY;

                c.save();
                c.translate(px, py);
                c.rotate(sweepAngle + Math.PI/2);
                

                c.fillStyle = isFoil
                    ? createFoilIconGradient(c, foilReversals[i], -7, -11, 7, 11)
                    : (i % 2 === 0) ? '#ffffff' : colorVal;
                c.beginPath();
                c.roundRect(-7, -11, 14, 22, 4);
                c.fill(); c.stroke();
                c.restore();
            }
            c.restore();
        }

        function buildHosePath(c, startX, startY, sideDir, segmentsCount) {
            c.beginPath();
            for (let i = 0; i < segmentsCount; i++) {
                const percent = i / (segmentsCount - 1);
                const angleOffset = percent * Math.PI * 0.65;
                const sweepAngle = (sideDir === -1) ? (Math.PI * 0.12 + angleOffset) : (Math.PI * 0.88 - angleOffset);
                
                const radiusX = 22;
                const radiusY = 28;
                const px = startX + Math.cos(sweepAngle) * radiusX;

                const py = startY + Math.sin(sweepAngle) * radiusY;

                if (i === 0) c.moveTo(px, py);
                else c.lineTo(px, py);
            }
        }

        function triggerDensityDownload() {
            toastMsg.style.opacity = '1';
            
            setTimeout(() => {
                const dpiMultiplier = parseFloat(document.querySelector('input[name="dpi-select"]:checked').value);
                
                const offscreenCanvas = document.createElement('canvas');
                const offscreenCtx = offscreenCanvas.getContext('2d');
                
                renderGrid(offscreenCtx, offscreenCanvas, dpiMultiplier);
                
                const now = new Date();

                const pad = (n) => String(n).padStart(2, '0');
                const timestamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
                
                const dataURL = offscreenCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `Starnaut_IconSet_${timestamp}.png`;
                link.href = dataURL;
                link.click();
                
                toastMsg.style.opacity = '0';
            }, 50);
        }

        generateGridSeeds();
        renderGrid();
    </script>
</body>
